services:
  postgres:
    image: postgres:15
    container_name: countryquiz_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?"Utilisateur non défini (.env)"}
      POSTGRES_DB: ${POSTGRES_DB:?"Base de données non définie (.env)"}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?"Mot de passe non défini (.env)"}
    ports:
      - "${POSTGRES_HOST:?Hôte non défini (.env)}:${POSTGRES_PORT:?Port non défini (.env)}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: countryquiz_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:?Port backend non défini (.env)}:3000"
    volumes:
      - ./backend:/app
      - ./backend/node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: countryquiz_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:?Port frontend non défini (.env)}:5173"
    volumes:
      - ./frontend:/app
      - ./frontend/node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data: